# Conda environment for the GPU stack (torch + vLLM). The dev server already has a
# working venv with the core stack; this file is for clean reproduction elsewhere.
# After creating: pip install -e ".[models,llm,conformal,dev]" then `make lock`.
name: avert
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch=2.4.*
  - pytorch-cuda=12.4
  - pip:
      - -e ".[models,llm,conformal,dev]"
