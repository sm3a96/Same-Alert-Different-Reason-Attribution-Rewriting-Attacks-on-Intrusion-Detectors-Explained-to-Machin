<?xml version="1.0" encoding="UTF-8"?>
<svg width="1580" height="940" viewBox="0 0 1365 812" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#222222">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"></path></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"></path></marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"></path></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"></path></marker>
  </defs>

  <!-- ===== clean lane, centre y = 200 ===== -->
  <text x="30" y="150" font-size="19" fill="#666666" font-weight="600">CLEAN</text>
  <rect x="30" y="168" width="120" height="64" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"></rect>
  <text x="90" y="194" text-anchor="middle">flow</text>
  <text x="90" y="220" text-anchor="middle" font-style="italic">x</text>

  <rect x="205" y="160" width="200" height="80" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"></rect>
  <text x="305" y="190" text-anchor="middle">detector f</text>
  <text x="305" y="219" text-anchor="middle" font-size="19">class: HTTP flood</text>

  <rect x="425" y="168" width="150" height="64" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"></rect>
  <text x="500" y="194" text-anchor="middle">attributor</text>
  <text x="500" y="221" text-anchor="middle" font-style="italic">g</text>

  <rect x="595" y="112" width="220" height="176" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"></rect>
  <text x="607" y="137" font-size="19">shown set T<tspan baseline-shift="sub" font-size="13">k</tspan>(x)</text>
  <rect x="605" y="146" width="200" height="25" fill="#DDEBF5"></rect>
  <text x="611" y="164" font-size="19">1  SrcWin</text><text x="801" y="164" font-size="19" text-anchor="end" fill="#0072B2">in S(x)</text>
  <text x="611" y="192" font-size="19">2  AckDat</text>
  <text x="611" y="219" font-size="19">3  DstWin</text>
  <text x="611" y="246" font-size="19">4  SrcBytes</text>
  <text x="611" y="273" font-size="19">5  TcpRtt</text>

  <rect x="835" y="154" width="155" height="92" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"></rect>
  <text x="912" y="182" text-anchor="middle">automated</text>
  <text x="912" y="207" text-anchor="middle">reader</text>
  <text x="912" y="234" text-anchor="middle" font-size="19" fill="#555555">picks the cause</text>

  <line x1="150" y1="200" x2="203" y2="200" stroke="#444444" stroke-width="1.5" marker-end="url(#ah)"></line>
  <line x1="405" y1="200" x2="423" y2="200" stroke="#444444" stroke-width="1.5" marker-end="url(#ah)"></line>
  <line x1="575" y1="200" x2="593" y2="200" stroke="#444444" stroke-width="1.5" marker-end="url(#ah)"></line>
  <line x1="815" y1="200" x2="833" y2="200" stroke="#444444" stroke-width="1.5" marker-end="url(#ah)"></line>

  <rect x="195" y="30" width="220" height="70" rx="6" fill="#E8F1F8" stroke="#0072B2" stroke-width="1.5"></rect>
  <text x="305" y="58" text-anchor="middle">erasure test</text>
  <text x="305" y="87" text-anchor="middle" font-style="italic">S(x)</text>
  <line x1="305" y1="160" x2="305" y2="102" stroke="#0072B2" stroke-width="1.8" marker-end="url(#ahb)"></line>

  <!-- adversary queries the clean pipeline -->
  <path d="M 415 200 L 415 340 L 160 340 L 160 488" fill="none" stroke="#D55E00" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aho)"></path>
  <text x="288" y="330" text-anchor="middle" font-size="19" fill="#D55E00">queries f, g, clean ranges</text>
  <text x="172" y="366" text-anchor="start" font-size="19" fill="#D55E00">rank promotion computes S(x) from f</text>

  <!-- prediction monitor watches the detector, nothing watches g -->
  <rect x="330" y="398" width="300" height="38" rx="4" fill="#F4F4F4" stroke="#999999" stroke-width="1" stroke-dasharray="3 2"></rect>
  <text x="480" y="424" text-anchor="middle" font-size="19" fill="#555555">monitor: class c, no alarm</text>
  <path d="M 305 520 L 305 417 L 328 417" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#ahg)"></path>
  <text x="478" y="630" text-anchor="middle" font-size="19" fill="#999999">nothing watches g</text>

  <!-- ===== attacked lane, centre y = 560 ===== -->
  <text x="10" y="474" font-size="19" fill="#666666" font-weight="600">ATTACKED</text>
  <rect x="10" y="492" width="180" height="136" rx="6" fill="#FBEBE0" stroke="#D55E00" stroke-width="1.5"></rect>
  <text x="100" y="521" text-anchor="middle">adversary</text>
  <text x="100" y="551" text-anchor="middle" font-size="19">x': displacement,</text>
  <text x="100" y="576" text-anchor="middle" font-size="19">rank promotion</text>
  <text x="100" y="608" text-anchor="middle" font-size="19">f': scaffolding</text>

  <rect x="205" y="520" width="200" height="98" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"></rect>
  <text x="305" y="550" text-anchor="middle">detector f or f'</text>
  <text x="305" y="579" text-anchor="middle" font-size="19">HTTP flood, kept</text>
  <text x="305" y="605" text-anchor="middle" font-size="19" fill="#555555">measured for f'</text>

  <rect x="425" y="528" width="150" height="64" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"></rect>
  <text x="500" y="554" text-anchor="middle">attributor</text>
  <text x="500" y="581" text-anchor="middle" font-style="italic">g</text>

  <rect x="595" y="472" width="220" height="176" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"></rect>
  <text x="607" y="497" font-size="19">shown set T<tspan baseline-shift="sub" font-size="13">k</tspan>(x')</text>
  <rect x="605" y="506" width="200" height="25" fill="#DDEBF5"></rect>
  <text x="611" y="524" font-size="19">1  AckDat</text><text x="801" y="524" font-size="19" text-anchor="end" fill="#0072B2">in S(x')</text>
  <text x="611" y="552" font-size="19">2  dTtl</text>
  <rect x="605" y="561" width="200" height="25" fill="#DDEBF5"></rect>
  <text x="611" y="579" font-size="19">3  SynAck</text><text x="801" y="579" font-size="19" text-anchor="end" fill="#0072B2">in S(x')</text>
  <text x="611" y="606" font-size="19">4  SrcTCPBase</text>
  <text x="611" y="633" font-size="19">5  TotBytes</text>
  <text x="705" y="676" text-anchor="middle" font-size="19" fill="#555555">SrcWin, in S(x) and S(x'), is no longer shown</text>

  <rect x="835" y="514" width="155" height="92" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"></rect>
  <text x="912" y="542" text-anchor="middle">automated</text>
  <text x="912" y="567" text-anchor="middle">reader</text>
  <text x="912" y="594" text-anchor="middle" font-size="19" fill="#555555">picks the cause</text>

  <line x1="190" y1="560" x2="203" y2="560" stroke="#D55E00" stroke-width="1.8" marker-end="url(#aho)"></line>
  <line x1="405" y1="560" x2="423" y2="560" stroke="#444444" stroke-width="1.5" marker-end="url(#ah)"></line>
  <line x1="575" y1="560" x2="593" y2="560" stroke="#444444" stroke-width="1.5" marker-end="url(#ah)"></line>
  <line x1="815" y1="560" x2="833" y2="560" stroke="#444444" stroke-width="1.5" marker-end="url(#ah)"></line>

  <rect x="195" y="700" width="220" height="70" rx="6" fill="#E8F1F8" stroke="#0072B2" stroke-width="1.5"></rect>
  <text x="305" y="728" text-anchor="middle">erasure test on h</text>
  <text x="305" y="757" text-anchor="middle" font-style="italic">S(x')</text>
  <line x1="305" y1="618" x2="305" y2="698" stroke="#0072B2" stroke-width="1.8" marker-end="url(#ahb)"></line>

  <!-- ===== measurements column ===== -->
  <text x="1010" y="128" font-size="19" fill="#666666" font-weight="600">MEASUREMENTS</text>

  <rect x="1010" y="140" width="345" height="160" rx="7" fill="#ffffff" stroke="#444444" stroke-width="1.5"></rect>
  <text x="1025" y="170" font-weight="700">Shown-set corruption</text>
  <text x="1025" y="199" font-size="19">J between T<tspan baseline-shift="sub" font-size="13">k</tspan>(x) and T<tspan baseline-shift="sub" font-size="13">k</tspan>(x')</text>
  <text x="1025" y="226" font-size="19">top-1 corruption, split into</text>
  <text x="1025" y="253" font-size="19">infidelity + reliance shift</text>
  <text x="1025" y="284" font-size="19" fill="#777777" font-style="italic">inputs: shown sets, S(x), S(x')</text>

  <rect x="1010" y="330" width="345" height="134" rx="7" fill="#ffffff" stroke="#444444" stroke-width="1.5"></rect>
  <text x="1025" y="360" font-weight="700">Harm to the reader</text>
  <text x="1025" y="389" font-size="19">paired clean versus attacked,</text>
  <text x="1025" y="416" font-size="19">scored on S(x) and S(x')</text>
  <text x="1025" y="447" font-size="19" fill="#777777" font-style="italic">inputs: both readers' choices</text>

  <rect x="1010" y="494" width="345" height="160" rx="7" fill="#ffffff" stroke="#444444" stroke-width="1.5"></rect>
  <text x="1025" y="524" font-weight="700">Runtime integrity checks</text>
  <text x="1025" y="553" font-size="19">seven checks, fused conformally</text>
  <text x="1025" y="580" font-size="19">attacked lane only at test time</text>
  <text x="1025" y="607" font-size="19">calibrated on clean flows</text>
  <text x="1025" y="638" font-size="19" fill="#777777" font-style="italic">inputs: x', g(x', f'), f'</text>
</svg>